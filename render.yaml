services:
  - type: web
    name: digitnepal-finance-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm run start --workspace @digitnepal/server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://finance.digitnepal.com
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
